name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skills:
    name: Agent Skills validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # AAA ships no node_modules; the validator is zero-dependency on purpose.
      - name: Validate skills against the agentskills.io spec
        run: node scripts/validate-skills.mjs skills

      # The validator and the bundle and work schemas are copies from AAW in
      # scripts/vendor/; the base ontology the architecture module names is this repo's.
      - name: Validate bundle.json against the bundle schema and the skills
        run: node scripts/validate-bundle.mjs --schemas standards/ontology .

      - name: The architecture ontology module builds on the work layer and the base
        run: node scripts/test-architecture-ontology.mjs

      # Each skill carries its own copy of the standards it reads, so it works installed on its
      # own. The copies are written from standards/ by the script; this fails when one differs.
      - name: Each skill's copy of the standards matches standards/
        run: node scripts/sync-skill-standards.mjs --check

      # Each skill ships its own copy of the check, so it is complete on its own.
      - name: The skills' post-install checks are one file
        run: |
          for f in skills/*/bin/check.mjs; do
            cmp skills/aaa-create-abb/bin/check.mjs "$f" || { echo "::error::$f differs from skills/aaa-create-abb/bin/check.mjs"; exit 1; }
          done

  skills-ref:
    name: Agent Skills reference validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # skills-ref is the specification's own reference validator. It is not
      # published to PyPI, so it installs from the agentskills repository, pinned
      # to a commit so a change upstream cannot turn this job red unannounced.
      - name: Install skills-ref
        run: pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

      # The skills bundle.json lists are the skills an installer ships. Validate
      # exactly those, and fail if a directory under skills/ is missing from the
      # list or the list names one that is not there.
      - name: Validate every skill bundle.json lists
        run: |
          listed=$(python -c "import json; print('\n'.join(s['path'] for s in json.load(open('bundle.json'))['skills']))" | sort)
          present=$(find skills -mindepth 2 -maxdepth 2 -name SKILL.md -printf '%h\n' | sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::bundle.json skills and the directories under skills/ differ"
            diff <(echo "$listed") <(echo "$present") || true
            exit 1
          fi
          status=0
          for d in $listed; do
            skills-ref validate "$d" || { echo "::error::$d fails skills-ref validate"; status=1; }
          done
          exit $status

  rung:
    name: aaa-rung tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Standard library only. Run once as-is, and once forcing the built-in front
      # matter parser, so the path taken where PyYAML is absent is always exercised.
      - name: Unit tests
        run: |
          python -m unittest discover skills/aaa-rung/tests
          AAA_RUNG_PURE_YAML=1 python -m unittest discover skills/aaa-rung/tests

  install:
    name: Install into a scratch workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: aaa

      # bin/skills.mjs, the installer for standalone skills, ships with AI-Assisted Work.
      - uses: actions/checkout@v7
        with:
          repository: dermot-obrien/ai-assisted-work
          path: aaw

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install the skills
        run: |
          mkdir -p /tmp/ws/.claude && cd /tmp/ws && git init -q .
          node "$GITHUB_WORKSPACE/aaw/bin/skills.mjs" install --bundle "$GITHUB_WORKSPACE/aaa"

      - name: Check the installed skills resolve
        run: |
          node "$GITHUB_WORKSPACE/aaa/scripts/validate-skills.mjs" /tmp/ws/.agents/skills
          for s in /tmp/ws/.claude/skills/aaa-*; do
            test -f "$s/SKILL.md" || { echo "::error::$s does not resolve"; exit 1; }
          done
          node "$GITHUB_WORKSPACE/aaw/bin/skills.mjs" check --workspace /tmp/ws

      # An installer runs each skill's check after installing it; this runs them the same way.
      - name: Each skill's post-install check fails unbound and passes bound
        run: |
          CHECK="node $GITHUB_WORKSPACE/aaa/scripts/validate-bundle.mjs --schemas $GITHUB_WORKSPACE/aaa/standards/ontology --run-checks /tmp/ws"
          if $CHECK "$GITHUB_WORKSPACE/aaa"; then
            echo "::error::the checks passed with nothing bound"; exit 1
          fi
          cd /tmp/ws
          mkdir -p .agents arch/outcomes arch/use-cases arch/platforms arch/capabilities arch/contexts arch/abbs arch/sbbs arch/services
          node .agents/skills/aaa-continuum/bin/continuum.mjs scaffold --root arch/continuum --namespace ws --name "Scratch" > /dev/null
          {
            echo '[suite.aaa-create-strategy]';  echo 'outcomeDir = "../arch/outcomes"'; echo 'useCaseDir = "../arch/use-cases"'
            echo '[suite.aaa-create-platform]';  echo 'platformDir = "../arch/platforms"'
            echo '[suite.aaa-create-capability]'; echo 'capabilityDir = "../arch/capabilities"'; echo 'platformDir = "../arch/platforms"'
            echo '[suite.aaa-create-context]';   echo 'contextDir = "../arch/contexts"'; echo 'platformDir = "../arch/platforms"'
            echo '[suite.aaa-create-abb]';       echo 'abbDir = "../arch/abbs"'
            echo '[suite.aaa-create-sbb]';       echo 'sbbDir = "../arch/sbbs"'
            echo '[suite.aaa-create-service]';   echo 'serviceDir = "../arch/services"'
            echo '[suite.aaa-rung]';             echo 'capabilityDir = "../arch/capabilities"'
            echo '[suite.aaa-continuum]';        echo 'root = "../arch/continuum"'
          } > .agents/skill-bindings.toml
          $CHECK "$GITHUB_WORKSPACE/aaa"
          # Each skill resolves its own bindings, with no other skill installed.
          node .agents/skills/aaa-create-abb/bin/check.mjs --json | node -e 'const r = JSON.parse(require("fs").readFileSync(0, "utf8")); if (r.status !== "ok" || !r.bindings.abbDir.endsWith("/arch/abbs")) { console.error(r); process.exit(1); }'

  continuum:
    name: Front matter schemas and the aaa-continuum skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # ajv, ajv-formats and js-yaml, which the validator and the skill's check both resolve from here.
      - run: npm ci

      - name: The foundation validates against the schemas
        run: node scripts/validate-frontmatter.mjs --quiet

      - name: The aaa-continuum skill's tests
        run: node --test skills/aaa-continuum/tests/*.test.mjs

      - name: The skill's check passes on its own scaffold
        run: |
          mkdir -p /tmp/cont/.agents && cd /tmp/cont
          node "$GITHUB_WORKSPACE/skills/aaa-continuum/bin/continuum.mjs" scaffold --root arch --namespace ws --name "Scratch" --bind
          cd "$GITHUB_WORKSPACE" && node skills/aaa-continuum/bin/continuum.mjs check --root /tmp/cont/arch --bindings /tmp/cont/.agents/skill-bindings.toml --strict

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6
