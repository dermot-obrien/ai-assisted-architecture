version: 1.0.0
foundation_source: https://github.com/dermot-obrien/ai-assisted-architecture/tree/main/foundation

imported_profiles:
- core

ontology:
  # Path to the schema used for ontology validation (relative to workspace root).
  # When omitted, the validator uses the base schema beside it, such as
  #   .agents/skills/architecture/references/standards/ontology/ontology-schema.json
  # Set this to an extension schema that composes on the base via allOf.
  schema: null

policy:
  workspace_is_canonical: true
  allow_framework_fallback_readonly: true
  require_copy_before_edit: true
