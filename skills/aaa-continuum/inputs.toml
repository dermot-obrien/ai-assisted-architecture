#
# Where this repository keeps its architecture. The skill checks a repository against the
# continuum's layout, front matter standard and registers; it carries the standards and the
# schemas, not the layout, so the root has no default: a default would be whichever repository
# the skill was written in, and a check run over the wrong folder passes for the wrong reason.
#
# Answer in [suite.aaa-continuum] of the repository's .agents/skill-bindings.toml.
# Paths resolve against that file's directory, never the working directory.
#
# Checked by:  node <skills>/aaa-continuum/bin/check.mjs   (--json prints the resolved paths)
#              node <skills>/aaa-continuum/bin/continuum.mjs doctor

[inputs]
short_description = "Where the architecture on the continuum lives"

[inputs.options.root]
type = "dir"
required = true
description = """The folder the architecture lives in, such as ../docs/architecture: its README.md is the map, and the demand, solution, runtime and decisions folders, the pages and the CSV registers sit under it."""

[inputs.options.schemes]
type = "file"
required = false
description = """The schemes register: which identifier series exist, where each kind's pages live (home) and which CSV lists them (register). Default: <root>/registers/identifier-schemes.csv when it exists."""

[inputs.options.namespaces]
type = "file"
required = false
description = """The namespaces register: the catalogues this one cites as ns:ID. Default: <root>/registers/identifier-namespaces.csv when it exists."""

[inputs.options.schemas]
type = "dir"
required = false
description = """A folder of the continuum's front matter schemas (envelope.schema.json and one per kind), to validate against a version other than the one this skill carries in references/standards/schemas/v1.1.0."""
