#
# Where this repository keeps the artefacts this skill authors. The skill carries the
# method, not the layout: it has no default for any directory below, because a default
# would be whichever repository the skill was written in, wrong everywhere else while
# looking like a feature.
#
# Answer in [suite.aaa-create-abb] of the repository's .agents/skill-bindings.toml.
# Paths resolve against that file's directory, never the working directory.
#
# Checked by:  python <skills>/model/bin/model.py doctor --skill aaa-create-abb

[inputs]
short_description = "Where Architecture Building Blocks are authored"

[inputs.options.abbDir]
type = "dir"
required = true
description = """Directory ABB folders are created in, one folder per ABB-NNN."""

[inputs.options.contextDir]
type = "dir"
required = false
description = """Where Bounded Contexts live, for the mandatory link back to the parent context."""

[inputs.options.capabilityDir]
type = "dir"
required = false
description = """Where Capabilities live, for the mandatory link back to the parent capability."""
