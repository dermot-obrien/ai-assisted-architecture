#
# Where this repository keeps the artefacts this skill authors. The skill carries the
# method, not the layout: it has no default for any directory below, because a default
# would be whichever repository the skill was written in, wrong everywhere else while
# looking like a feature.
#
# Answer in [suite.aaa-create-capability] of the repository's .agents/skill-bindings.toml.
# Paths resolve against that file's directory, never the working directory.
#
# Checked by:  python <skills>/model/bin/model.py doctor --skill aaa-create-capability

[inputs]
short_description = "Where business Capabilities are authored"

[inputs.options.capabilityDir]
type = "dir"
required = true
description = """Directory Capability folders are created in, one folder per CAP-NNN."""

[inputs.options.platformDir]
type = "dir"
required = true
description = """Where Platforms live. Searched to establish which PL-NNN a capability belongs to, which is the first question this skill asks."""
