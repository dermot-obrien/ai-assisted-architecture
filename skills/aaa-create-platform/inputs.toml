#
# Where this repository keeps the artefacts this skill authors. The skill carries the
# method, not the layout: it has no default for any directory below, because a default
# would be whichever repository the skill was written in, wrong everywhere else while
# looking like a feature.
#
# Answer in [suite.aaa-create-platform] of the repository's .agents/skill-bindings.toml.
# Paths resolve against that file's directory, never the working directory.
#
# Checked by:  python <skills>/model/bin/model.py doctor --skill aaa-create-platform

[inputs]
short_description = "Where Platforms are authored"

[inputs.options.platformDir]
type = "dir"
required = true
description = """Directory Platform folders are created in, one folder per PL-NNN."""

[inputs.options.outcomeDir]
type = "dir"
required = false
description = """Where the Strategic Outcomes a Platform links up to live. Bound so the link can be written as a folder-relative path rather than searched for."""
