#
# Where this repository keeps the artefacts this skill authors. The skill carries the
# method, not the layout: it has no default for any directory below, because a default
# would be whichever repository the skill was written in, wrong everywhere else while
# looking like a feature.
#
# Answer in [suite.aaa-create-runtime-agent] of the repository's .agents/skill-bindings.toml.
# Paths resolve against that file's directory, never the working directory.
#
# Checked by:  python <skills>/model/bin/model.py doctor --skill aaa-create-runtime-agent

[inputs]
short_description = "Where a runtime agent's records and its validation live"

[inputs.options.agentProfileSchema]
type = "file"
required = false
description = """The agent profile JSON Schema an authored profile is validated against. Unbound means the profile is written but not schema-checked, and the skill says so rather than skipping quietly."""

[inputs.options.ontologyValidator]
type = "file"
required = false
description = """The repository's ontology validator, run over each record this skill writes. Unbound means the same: authored, not validated."""
