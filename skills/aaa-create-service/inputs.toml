#
# Where this repository keeps the artefacts this skill authors. The skill carries the
# method, not the layout: it has no default for any directory below, because a default
# would be whichever repository the skill was written in, wrong everywhere else while
# looking like a feature.
#
# Answer in [suite.aaa-create-service] of the repository's .agents/skill-bindings.toml.
# Paths resolve against that file's directory, never the working directory.
#
# Checked by:  python <skills>/model/bin/model.py doctor --skill aaa-create-service

[inputs]
short_description = "Where runtime Services are authored"

[inputs.options.serviceDir]
type = "dir"
required = true
description = """Directory service definitions are written to, one file per service."""

[inputs.options.contextDir]
type = "dir"
required = false
description = """Where Bounded Contexts live, for the mandatory link to the parent context."""

[inputs.options.sbbDir]
type = "dir"
required = false
description = """Where SBBs live, for the mandatory link to the physical SBB."""
