#
# Where this repository keeps the artefacts this skill authors. The skill carries the
# method, not the layout: it has no default for any directory below, because a default
# would be whichever repository the skill was written in, wrong everywhere else while
# looking like a feature.
#
# Answer in [suite.aaa-create-strategy] of the repository's .agents/skill-bindings.toml.
# Paths resolve against that file's directory, never the working directory.
#
# Checked by:  python <skills>/model/bin/model.py doctor --skill aaa-create-strategy

[inputs]
short_description = "Where Strategic Outcomes and Use Cases are authored"

[inputs.options.outcomeDir]
type = "dir"
required = true
description = """Directory Strategic Outcome folders are created in, one folder per OC-NNN."""

[inputs.options.useCaseDir]
type = "dir"
required = true
description = """Directory Use Case folders are created in, one folder per UC-NNN. It may be the same directory as outcomeDir where a repository keeps them together."""
