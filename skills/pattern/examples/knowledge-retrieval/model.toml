bindingsVersion = "1.0"

# Contract for the pattern template. Section headings and column names
# come from assets/template.md; identifier patterns are the ABB and IF series.

[model]
node_id_attrs = ["abb_id", "sbb_id"]
edge_id_attr  = "iface_id"
group_attr    = "pattern"

[[markdown.tables]]
section    = "Building Blocks"
entity     = "node"
id_pattern = "(ABB|SBB)-[0-9]{3}"
columns    = { id = "Building Block", label = "Building Block", group = "Source" }

[[markdown.tables]]
section    = "Interfaces"
entity     = "edge"
id_pattern = "(IF-[0-9]{2,3}|ABB-[0-9]{3}|SBB-[0-9]{3})"
columns    = { id = "Interface", source = "Provider", target = "Consumer", label = "Purpose" }

[markdown.scenarios]
section         = "Scenarios"
heading_pattern = '^(S[0-9]+)\b[\s:.-]*(.*)$'
columns         = { step = "Step", actor = "Actor", action = "Action", edge = "Interface", target = "Target" }

[rules]
node_id_mismatch = "warn"
edge_missing_id  = "warn"

[style]
node  = "rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#25303F;fontColor=#25303F;fontSize=14;align=center;verticalAlign=middle;"
edge  = "edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;fontSize=11;strokeColor=#3A4654;fontColor=#3A4654;labelBackgroundColor=#FFFFFF;"
badge = "ellipse;whiteSpace=wrap;html=1;fillColor=#C25B54;strokeColor=none;fontColor=#FFFFFF;fontSize=14;fontStyle=1;"
flow  = "edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;dashed=1;strokeWidth=2;strokeColor=#C25B54;fontColor=#C25B54;fontSize=13;fontStyle=1;labelBackgroundColor=#FFFFFF;"
