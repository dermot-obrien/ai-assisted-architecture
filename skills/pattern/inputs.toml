# SPDX-License-Identifier: Apache-2.0
#
# What this skill needs from the repository it is installed into, and nothing about
# where any of it lives. The consuming repository answers in [suite.pattern]
# of its .agents/skill-bindings.toml.
#
# Checked by:  python <skills>/model/bin/model.py doctor --skill pattern
#
# This skill ships no runtime of its own. It borrows the model skill's resolver, which is
# why `model` is a declared dependency rather than a suggestion.

[inputs]
short_description = "Bindings required to author a pattern in this repository"

[inputs.options.outputDir]
type = "dir"
required = true
description = "Directory new pattern folders are created in"

[inputs.options.template]
type = "file"
required = false
description = """The repository's own pattern template, used instead of the
generic one this skill ships. A template carries a house profile: the identifier series,
the deliverable code, the diagram palette and any conformance statement. That profile
belongs to the repository, not to a published skill."""

[inputs.options.idSeries]
type = "str"
required = false
default = "PAT"
description = "Identifier prefix for patterns, e.g. PAT gives PAT-001"

[inputs.options.deckTheme]
type = "str"
required = false
default = "default"
description = "Theme name passed to markdown-deck when publishing the deck"

[inputs.options.ontologySchema]
type = "file"
required = false
description = """Schema the document's section structure is expected to conform to, vendored
into this repository. Pin its digest with `ontologySchemaSha256` so a drifted copy is caught
rather than silently used."""

[inputs.options.ontologySchemaSha256]
type = "str"
required = false
description = "SHA-256 of ontologySchema, so a vendored copy that has drifted is an error"
