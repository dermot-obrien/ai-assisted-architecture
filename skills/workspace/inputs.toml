#
# What a repository's regeneration produces and from where. Every option is optional: with none
# bound, regenerate publishes the diagrams of the folders [suite.use-case] and [suite.pattern]
# already bind, and skips the decks in one line, so the build still runs.
#
# Answer in [suite.workspace] of the repository's .agents/skill-bindings.toml.
# Paths resolve against that file's directory, never the working directory.
#
# Checked by:  node <skills>/workspace/bin/check.mjs   (--json prints the resolved paths)
#              node <skills>/workspace/bin/workspace.mjs doctor

[inputs]
short_description = "What the repository's build regenerates from its pages"

[inputs.options.decks]
type = "output-dir"
required = false
description = """The folder decks publish to, one folder per deck_id with a PDF beside each, such as ../site/static/decks for a Docusaurus site whose static files are under site/static. Unbound, no decks are published. It need not exist: the first publish creates it."""

[inputs.options.deckSource]
type = "dir"
required = false
description = """The folder whose documents marked deck_publish: true become decks. Default: [suite.architecture] root."""

[inputs.options.pdf]
type = "boolean"
required = false
description = """Whether each deck gets a PDF beside it. Default: [suite.markdown-deck] pdf. DECK_PDF=0 in the environment turns it off for one run."""

[inputs.options.diagrams]
type = "list"
required = false
description = """The folders whose use cases and pattern documents have their diagrams, stamped exports and walkthroughs regenerated by the pattern skill, as a list. Default: [suite.use-case] outputDir and [suite.pattern] outputDir."""

[inputs.options.render]
type = "string"
required = false
description = """How the pattern skill renders views: never (the default, so a build needs no draw.io desktop), or auto or always where draw.io desktop is installed."""
